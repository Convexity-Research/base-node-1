events {
    worker_connections 1024;
}

http {
    upstream base_node {
        server execution:8546;
    }

    # Whitelist of allowed IPs
    geo $allowed_ip {
        default 1;  # Temporarily allow all IPs for testing
        #173.178.137.197/32 1;  # Marion home
        #70.19.66.98/32 1;      # Ryan home
        #86.213.31.107/32 1;    # Marion in-laws
        #8.10.67.62/32 1;       # skip hq
        #70.73.135.66/32 1;     # ilya home
        #90.125.2.13/32 1;      # marion parents
        #10.0.0.0/8 1;          # internal network
        #34.134.69.199/32 1;    # base node static IP
        #127.0.0.1/32 1;        # localhost ipv4
        #::1/128 1;             # localhost ipv6
        #172.0.0.0/8 1;         # Docker internal network
    }

    server {
        listen 8545;
        
        location / {
            # Get real client IP from Cloudflare
            set $real_ip $http_cf_connecting_ip;
            
            # If no Cloudflare header, use remote_addr
            if ($real_ip = "") {
                set $real_ip $remote_addr;
            }

            # Check if IP is allowed
            if ($allowed_ip = 0) {
                return 403;
            }

            proxy_pass http://base_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $real_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
} 