events {
    worker_connections 1024;
}

http {
    upstream base_node {
        server base-node:8545;
    }

    # Cloudflare IPs
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Use Cloudflare's CF-Connecting-IP header
    real_ip_header CF-Connecting-IP;

    # IP whitelist
    geo $whitelist {
        default 0;
        8.10.67.62 1;        # Your IP
        173.178.137.197/32 1;  # Marion home
        70.19.66.98/32 1;      # Ryan home
        86.213.31.107/32 1;    # Marion in-laws
        70.73.135.66/32 1;     # ilya home
        90.125.2.13/32 1;      # marion parents
    }

    map $whitelist $limit {
        0 $binary_remote_addr;
        1 "";
    }

    limit_req_zone $limit zone=ip_limit:10m rate=10r/s;

    # Base Node RPC
    server {
        listen 443 ssl;
        server_name base.convexitylabs.us;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        access_log /dev/stdout combined;

        location / {
            if ($whitelist = 0) {
                add_header X-Debug-Real-IP $remote_addr;
                add_header X-Debug-Whitelist $whitelist;
                return 403;
            }

            limit_req zone=ip_limit burst=20 nodelay;
            proxy_pass http://base_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name base.convexitylabs.us;
        return 301 https://$server_name$request_uri;
    }
} 